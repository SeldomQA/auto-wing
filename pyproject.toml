[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "autowing"
version = "0.8.1"
description = "auto-wing is a tool that uses LLM to assist automated testing."
readme = "README.md"
authors = [
    { name = "defnngj", email = "defnngj@gmail.com" }
]
requires-python = ">=3.10,<4.0"

dependencies = [
    "openai>=2.15.0, <3.0.0",
    "dashscope>=1.25.9,<2.0.0",
    "google-genai (>=1.62.0,<2.0.0)",
    "python-dotenv>=1.2.1,<2.0.0",
    "loguru>=0.7.3,<0.8.0",
]

[project.optional-dependencies]
# Web automation drivers (choose as needed)
playwright = ["pytest-playwright>=0.6.0"]
selenium = ["selenium>=4.20.0"]
# App automation driver
appium = ["Appium-Python-Client>=5.1.0"]
# Development & testing
dev = ["pytest>=8.0.0", "pytest-mock>=3.12.0", "ruff>=0.5.0"]

[project.urls]
repository = "https://github.com/SeldomQA/auto-wing"
homepage = "https://github.com/SeldomQA/auto-wing"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 120
# Lint the package and the test suite; examples/ stays free-form.
src = ["autowing", "tests"]

[tool.ruff.lint]
# Start conservative: obvious defects only (pyflakes, fatal pycodestyle,
# invalid escapes, bugbear) - no blanket style enforcement yet (plan item T3).
select = ["E9", "F", "W6", "B"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures build objects via __new__ and rely on dynamic attributes
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
# Progressive adoption: drivers have no usable stubs, so ignore missing
# imports globally; strict mode is enabled per-module below (plan: start
# with autowing.core).
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false

# Core logic first: tighten gradually per module
[[tool.mypy.overrides]]
module = "autowing.utils.*"
disallow_untyped_defs = true

# LLM SDK stubs are overly strict (model-name literals, message param
# unions); cache internals are migrated gradually. Silence for now.
[[tool.mypy.overrides]]
module = ["autowing.core.llm.client.*", "autowing.core.cache.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["autowing.playwright.*", "autowing.selenium.*", "autowing.appium.*"]
ignore_errors = true

